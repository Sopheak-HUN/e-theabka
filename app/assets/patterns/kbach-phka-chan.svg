<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="120" height="120" viewBox="0 0 120 120">
  <!-- Kbach phka chan: four-petal gold flowers (double centre ring, ogee petals with an
       open inner arch) on a 45-degree lattice, over a pale layer of eight-lobed rosettes.
       Drawn at full strength; the page sets the opacity. -->
  <defs>
    <!-- Ogee petal: sides swell out, then narrow to a flared point -->
    <g id="petal">
      <path class="gold" d="M-6.4 -10.6C-15.5 -12.8 -20 -23 -12.2 -30.2 -8.2 -33.8 -3.2 -36.4 0 -42.6 3.2 -36.4 8.2 -33.8 12.2 -30.2 20 -23 15.5 -12.8 6.4 -10.6" />
      <path class="gold thin" d="M-5 -19C-10 -21.4 -9.6 -27 -4.2 -30.2 -2.2 -31.4 -0.7 -33.2 0 -36 0.7 -33.2 2.2 -31.4 4.2 -30.2 9.6 -27 10 -21.4 5 -19" />
    </g>
    <g id="flower">
      <use href="#petal" xlink:href="#petal" />
      <use href="#petal" xlink:href="#petal" transform="rotate(90)" />
      <use href="#petal" xlink:href="#petal" transform="rotate(180)" />
      <use href="#petal" xlink:href="#petal" transform="rotate(270)" />
      <circle class="gold ring" r="12.4" />
      <circle class="gold thin" r="9" />
    </g>
    <g id="rosette">
      <path class="pale" d="M6.31 -15.24A6.8 6.8 0 0 1 15.24 -6.31A6.8 6.8 0 0 1 15.24 6.31A6.8 6.8 0 0 1 6.31 15.24A6.8 6.8 0 0 1 -6.31 15.24A6.8 6.8 0 0 1 -15.24 6.31A6.8 6.8 0 0 1 -15.24 -6.31A6.8 6.8 0 0 1 -6.31 -15.24A6.8 6.8 0 0 1 6.31 -15.24Z" />
      <path class="pale" d="M3.83 -9.24A4 4 0 0 1 9.24 -3.83A4 4 0 0 1 9.24 3.83A4 4 0 0 1 3.83 9.24A4 4 0 0 1 -3.83 9.24A4 4 0 0 1 -9.24 3.83A4 4 0 0 1 -9.24 -3.83A4 4 0 0 1 -3.83 -9.24A4 4 0 0 1 3.83 -9.24Z" />
      <circle class="pale" r="4" />
    </g>
  </defs>

  <style>
    .gold { fill: none; stroke: #A88642; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; }
    .thin { stroke-width: 1.2; }
    .ring { stroke-width: 3; }
    .pale { fill: none; stroke: #C9A45C; stroke-opacity: 0.4; stroke-width: 1.1; }
  </style>

  <!-- Pale rosettes in the cells and between the flowers, under the gold -->
  <use href="#rosette" xlink:href="#rosette" transform="translate(60 0)" />
  <use href="#rosette" xlink:href="#rosette" transform="translate(0 60)" />
  <use href="#rosette" xlink:href="#rosette" transform="translate(120 60)" />
  <use href="#rosette" xlink:href="#rosette" transform="translate(60 120)" />
  <use href="#rosette" xlink:href="#rosette" transform="translate(30 30)" />
  <use href="#rosette" xlink:href="#rosette" transform="translate(90 30)" />
  <use href="#rosette" xlink:href="#rosette" transform="translate(30 90)" />
  <use href="#rosette" xlink:href="#rosette" transform="translate(90 90)" />

  <!-- Gold flowers on the lattice; the corner flower repeats across tiles -->
  <use href="#flower" xlink:href="#flower" transform="translate(60 60)" />
  <use href="#flower" xlink:href="#flower" transform="translate(0 0)" />
  <use href="#flower" xlink:href="#flower" transform="translate(120 0)" />
  <use href="#flower" xlink:href="#flower" transform="translate(0 120)" />
  <use href="#flower" xlink:href="#flower" transform="translate(120 120)" />
</svg>
